# Live track record: three times a day, settle finished matches, commit forecasts for matches in the
# next 4 days, rebuild ledger/TRACK_RECORD.md, and push the ledger. Pushing *before kickoff* is
# what makes each forecast verifiable. GitHub runs scheduled workflows only on the repository's
# default branch.
name: live-track-record
on:
  schedule:
    - cron: "17 5,11,17 * * *"   # GitHub may delay or drop scheduled runs under load; three slots keep a margin
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: track-record
jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py --live
      - run: python scripts/live.py cycle
      - name: Push ledger
        run: |
          git config user.name "track-record-bot"
          git config user.email "track-record-bot@users.noreply.github.com"
          git add ledger
          git diff --cached --quiet || { git commit -m "ledger: cycle $(date -u +%Y-%m-%dT%H:%MZ)"; git push; }
