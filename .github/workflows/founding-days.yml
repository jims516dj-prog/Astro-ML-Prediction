# Founding dates known to the day (soccer day reading): Wikidata inception, Wikipedia infoboxes, and national
# associations for national teams. Monthly, or on demand.
name: founding-days
on:
  workflow_dispatch: {}
  schedule:
    - cron: "11 4 9 * *"
permissions:
  contents: write
concurrency: track-record
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_founding_days.py
      - name: Publish
        run: |
          git config user.name "track-record-bot"
          git config user.email "track-record-bot@users.noreply.github.com"
          git add data/ref/team_founding_days.json
          git diff --cached --quiet || { git commit -m "founding dates: Wikidata / Wikipedia $(date -u +%Y-%m-%d)"; ok=; for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && { ok=1; break; }; git rebase --abort 2>/dev/null; sleep $((i * 10)); done; test -n "$ok"; }
