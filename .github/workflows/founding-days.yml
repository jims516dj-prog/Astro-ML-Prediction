# Founding dates known to the day (soccer day reading) and official club names: Wikidata inception, Wikipedia infoboxes, and national
# associations for national teams. Monthly, or on demand.
name: founding-days
on:
  workflow_dispatch: {}
  schedule:
    - cron: "11 4 9 * *"
permissions:
  contents: write
concurrency: founding-days
jobs:
  # three lookups side by side, each with its own time limit, each publishing its own file
  founding-days:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                  # the latest main, not the commit the run was queued on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_founding_days.py
        continue-on-error: true
      - name: Publish (whatever was found, even if the run stopped early)
        if: always()
        run: |
          git config user.name "track-record-bot"
          git config user.email "track-record-bot@users.noreply.github.com"
          for f in data/ref/team_founding_days.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || { git commit -m "founding dates: Wikidata / Wikipedia $(date -u +%Y-%m-%d)"; ok=; for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && { ok=1; break; }; git rebase --abort 2>/dev/null; sleep $((i * 10)); done; test -n "$ok"; }

  club-names:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                  # the latest main, not the commit the run was queued on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Official club names (Wikidata)
        run: python scripts/fetch_official_names.py
        continue-on-error: true
      - name: Publish (merged with main, so a name already found is never lost)
        if: always()
        run: |
          git config user.name "track-record-bot"
          git config user.email "track-record-bot@users.noreply.github.com"
          F=data/ref/team_names.json
          [ -f "$F" ] || exit 0
          cp "$F" "$RUNNER_TEMP/mine.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git show FETCH_HEAD:$F > "$RUNNER_TEMP/main.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/main.json"
            cp "$RUNNER_TEMP/mine.json" "$F"
            python scripts/fetch_official_names.py --merge "$RUNNER_TEMP/main.json"
            git reset -q FETCH_HEAD
            git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "official club names: Wikidata $(date -u +%Y-%m-%d)" && git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1

  tennis-names:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                  # the latest main, not the commit the run was queued on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tennis players' legal names (Wikidata)
        run: python scripts/fetch_tennis_names.py
        continue-on-error: true
      - name: Publish (whatever was found, even if the run stopped early)
        if: always()
        run: |
          git config user.name "track-record-bot"
          git config user.email "track-record-bot@users.noreply.github.com"
          for f in data/ref/tennis_names.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || { git commit -m "tennis legal names: Wikidata $(date -u +%Y-%m-%d)"; ok=; for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && { ok=1; break; }; git rebase --abort 2>/dev/null; sleep $((i * 10)); done; test -n "$ok"; }
