# Tennis: rebuild the ESPN history (new results), refresh players' birth details and retrain the set
# models with fine-tuning and a walk-forward check (weekly, or on demand). "probe" = diagnostics only.
name: tennis
on:
  schedule:
    - cron: "23 3 * * 2"      # Tuesdays 03:23 UTC
  workflow_dispatch:
    inputs:
      cmd:
        description: "all (build + train), train (retrain only) or probe (diagnostics)"
        required: false
        default: "all"
permissions:
  contents: write
concurrency: tennis
jobs:
  tennis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py --live     # cities table: venue timezones for the match day's chart
      - if: ${{ inputs.cmd == 'soccer-probe' }}
        run: python scripts/soccer_sources_probe.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          X_APISPORTS_KEY: ${{ secrets.X_APISPORTS_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDSAPIIO_KEY: ${{ secrets.ODDSAPIIO_KEY }}
          ODDS_API_IO: ${{ secrets.ODDS_API_IO }}
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSLINK_KEY: ${{ secrets.ODDSLINK_KEY }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          FIVEDOLLAR_KEY: ${{ secrets.FIVEDOLLAR_KEY }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          SPORTSDATA_KEY: ${{ secrets.SPORTSDATA_KEY }}
          BSD_KEY: ${{ secrets.BSD_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          LIVETENNISAPI_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
      - if: ${{ inputs.cmd == 'probe' }}
        run: python scripts/tennis_probe.py
        env:
          GH_TOKEN: ${{ github.token }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LIVETENNISAPI_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
      - name: Build history (ESPN) and players
        if: ${{ inputs.cmd != 'probe' && inputs.cmd != 'soccer-probe' && inputs.cmd != 'train' }}
        run: python scripts/tennis.py build
      - name: Publish data
        if: ${{ inputs.cmd != 'probe' && inputs.cmd != 'soccer-probe' && inputs.cmd != 'train' }}
        run: |
          git config user.name "track-record-bot"
          git config user.email "track-record-bot@users.noreply.github.com"
          git add data/tennis/matches.parquet data/tennis/players.parquet
          git diff --cached --quiet || { git commit -m "tennis: history $(date -u +%Y-%m-%d)"; ok=; for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && { ok=1; break; }; git rebase --abort 2>/dev/null; sleep $((i * 10)); done; test -n "$ok"; }
      - name: Train (fine-tune + walk-forward)
        if: ${{ inputs.cmd != 'probe' && inputs.cmd != 'soccer-probe' }}
        run: python scripts/tennis.py train
      - name: Publish model
        if: ${{ inputs.cmd != 'probe' && inputs.cmd != 'soccer-probe' }}
        run: |
          git config user.name "track-record-bot"
          git config user.email "track-record-bot@users.noreply.github.com"
          git add data/models/tennis.joblib data/models/tennis.json
          git diff --cached --quiet || { git commit -m "tennis: model $(date -u +%Y-%m-%d)"; ok=; for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && { ok=1; break; }; git rebase --abort 2>/dev/null; sleep $((i * 10)); done; test -n "$ok"; }
